name: edge_dr_app
description: EDGE-DR — Offline Explainable AI for Diabetic Retinopathy Screening

publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # TFLite runtime for on-device INT8 inference
  tflite_flutter: ^0.10.4
  tflite_flutter_helper: ^0.4.0

  # Camera
  camera: ^0.10.5+5
  image_picker: ^1.0.4

  # Image processing
  image: ^4.1.3

  # Local database (encrypted screening records)
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3

  # Internationalization
  flutter_localizations:
    sdk: flutter
  intl: ^0.18.1

  # PDF referral generation
  pdf: ^3.10.6
  printing: ^5.11.3

  # SMS / sharing referral
  share_plus: ^7.1.0
  url_launcher: ^6.2.1

  # UI components
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  fl_chart: ^0.65.0        # confidence bar chart
  shimmer: ^3.0.0          # loading shimmer

  # Location (geo-tagged referral)
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # State management
  provider: ^6.1.1

  # Utilities
  uuid: ^4.2.1
  logger: ^2.0.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/models/edge_dr.tflite
    - assets/i18n/

  fonts:
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-Regular.ttf

